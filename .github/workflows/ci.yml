name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck --severity=warning plugins/learner/hooks/*.sh install.sh uninstall.sh bootstrap.sh test.sh scripts/bump-formula.sh packaging/deb/build.sh packaging/apt-repo/assemble-site.sh

      - name: tests
        run: ./test.sh

      # The community-marketplace review pipeline runs exactly this on every
      # submission, so a failure here is a rejection there. Two calls, not one:
      # `validate` picks the manifest it finds at the path it is given, and the
      # marketplace and the plugin are now separate directories.
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: validate the marketplace, the plugin and the root fallback
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugins/learner --strict
          # The root is a plugin too (see the root fallback in test.sh), but
          # `validate` picks the marketplace manifest when both sit in
          # .claude-plugin/ — so check it on a copy with the marketplace removed.
          rm -rf /tmp/rootplugin && mkdir -p /tmp/rootplugin
          git archive HEAD | tar -x -C /tmp/rootplugin
          rm -f /tmp/rootplugin/.claude-plugin/marketplace.json
          claude plugin validate /tmp/rootplugin --strict

      - name: plugin.json version matches VERSION
        run: |
          PLUGIN_VERSION=$(jq -r '.version' plugins/learner/.claude-plugin/plugin.json)
          FILE="$(cat VERSION)"
          if [ "$PLUGIN_VERSION" != "$FILE" ]; then
            echo "plugin.json version ($PLUGIN_VERSION) does not match VERSION file ($FILE)"; exit 1
          fi

      - name: tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "tag v$TAG does not match VERSION file ($FILE)"; exit 1
          fi

  release:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: build .deb
        run: bash packaging/deb/build.sh

      - name: publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: learner_*_all.deb

  # Its own job so a tap failure never holds back the site deploy: the .deb
  # is already out by then, and the tap can be re-run on its own.
  publish-tap:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bump the formula to this tag
        run: scripts/bump-formula.sh "$GITHUB_REF_NAME"

      - uses: actions/checkout@v4
        with:
          repository: Tykok/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: push the formula to Tykok/homebrew-tap
        run: |
          mkdir -p tap/Formula
          cp Formula/learner.rb tap/Formula/learner.rb
          cd tap
          git add Formula/learner.rb
          if git diff --cached --quiet; then
            echo "tap already has learner $GITHUB_REF_NAME"; exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "learner $GITHUB_REF_NAME"
          git push

  deploy-pages:
    needs: [ci, release]
    if: always() && github.event_name != 'pull_request' && needs.ci.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: bash packaging/apt-repo/assemble-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
